# MINT - Konfigurasi broker Mosquitto (testbed lokal terisolasi)
# Sesuai Spesifikasi Teknis MINT Bab 2.3

listener 1883
protocol mqtt

# Testbed terisolasi: anonim diperbolehkan (di luar jaringan lab, wajib auth!)
allow_anonymous true

# Payload besar untuk skenario S3 (128 MB, eksplisit demi kejelasan)
message_size_limit 134217728

# Kelonggaran untuk skenario flood / multi-device burst
max_connections 200
max_keepalive 120

# Log ke stdout agar mudah dipantau: docker logs -f mint-mosquitto
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
